services:
  backend:
    image: ${BACKEND_IMAGE:-image-transformer-backend:1.3.1}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: image-transformer-backend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - LOG_LEVEL=silent
    env_file:
      - ./backend/.env
    volumes:
      - backend-temp:/app/backend/temp
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - proxy-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001']
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE:-image-transformer-frontend:1.3.1}
    build:
      context: .
      target: production
    container_name: image-transformer-frontend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - proxy-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy-net:
    name: ${DOCKER_PROXY_NETWORK:-proxy-tier}
    external: true

volumes:
  backend-temp:
    driver: local
