services:
  backend:
    image: ${BACKEND_IMAGE:-image-transformer-backend:2.0.1}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: image-transformer-backend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - LOG_LEVEL=silent
    env_file:
      - ./backend/.env
    # No temp volume on purpose: temp/ holds only ephemeral uploads/ZIPs
    # (5-minute TTL cleanup) and the backend runs as USER node, which cannot
    # write into a root-owned named volume. Ephemeral container storage is
    # sufficient and safer.
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - proxy-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001']
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE:-image-transformer-frontend:2.0.1}
    build:
      context: .
      target: production
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: image-transformer-frontend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # The unprivileged nginx image serves on 8080: point the outer reverse
    # proxy (proxy-tier network) at <frontend>:8080, not :80.
    expose:
      - "8080"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - proxy-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy-net:
    name: ${DOCKER_PROXY_NETWORK:-proxy-tier}
    external: true

