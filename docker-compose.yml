services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: image-transformer-backend
    ports:
      - '3001:3001'
    volumes:
      - .:/app:delegated
      - /app/node_modules
      - /app/backend/node_modules
      - backend-temp:/app/backend/temp
      - backend-logs:/app/backend/logs
    environment:
      - NODE_ENV=development
      - PORT=3001
      - TSX_DISABLE_CACHE=false
      - DEBUG=tsx:*
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - LOG_LEVEL=debug
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001']
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      target: development
    container_name: image-transformer-frontend
    ports:
      - '5173:5173'
    volumes:
      - ./:/app:delegated
      - /app/node_modules
      - ./node_modules/.vite:/app/node_modules/.vite
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3001/api
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - FAST_REFRESH=true
      - VITE_HMR=true
      - VITE_DEBUG=true
    depends_on:
      - backend
    restart: unless-stopped
    command: pnpm run dev -- --host 0.0.0.0

volumes:
  backend-temp:
    driver: local
  backend-logs:
    driver: local
