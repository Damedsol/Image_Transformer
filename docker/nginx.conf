server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Hide Nginx version signature for security
    server_tokens off;

    # Gzip compression to optimize performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Block access to hidden files and directories (dotfiles), except for Let's Encrypt .well-known
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to sensitive configuration and development files
    location ~* (?:package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json|Dockerfile|docker-compose.*\.yml|Procfile|serverless\.yml|sftp\.json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to unused technology endpoints (Kibana, Elasticsearch, Swagger, etc.)
    location ~* ^/(?:_cat|graphql|swagger-ui|v2/api-docs|app/kibana|server-status|server-info) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Cache control for legitimate static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Proxy requests to the API backend
    location ^~ /api/ {
        # Limit payload upload size to prevent buffer overflow/DoS
        client_max_body_size 50M;

        # Restrict HTTP methods allowed to backend
        limit_except GET POST OPTIONS {
            deny all;
        }

        proxy_pass http://image-transformer-backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy requests to backend temp storage for download
    location ^~ /temp/ {
        # Restrict temp folder to read-only methods
        limit_except GET OPTIONS {
            deny all;
        }

        proxy_pass http://image-transformer-backend:3001/temp/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing for legitimate dynamic frontend routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Prevent SPA rewrite for any missing static file containing an extension
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }
}