packages:
  - '.'
  - 'backend'
resolutionMode: lowest-direct 
strictPeerDependencies: true 
preferFrozenLockfile: true 
hoist: true 
shamefullyHoist: false 
hoistPattern:
  - '*'
publicHoistPattern:
  - '@types/*'
engineStrict: true 
verifyStoreIntegrity: true 
blockExoticSubdeps: true 
allowBuilds:
  esbuild: true
  sharp: true

registries:
  default: https://registry.npmjs.org/

minimumReleaseAge: 7200  
catalog:
    "@biomejs/biome": "^2.0.0"
    "@commitlint/cli": "^21.0.0"
    "@commitlint/config-conventional": "^21.0.0"
    "concurrently": "^10.0.4"
    "globals": "^17.0.0"
    "husky": "^9.0.0"
    "lint-staged": "^16.0.0"
    "oxlint": "^1.0.0"
    "typescript": "^6.0.0"
    "vite": "^8.0.0"

overrides:
  "brace-expansion@^1.0.0": "1.1.12"
  "brace-expansion@^2.0.0": "2.1.4"
  "brace-expansion@^5.0.0": "5.0.9"
  "glob": ">=10.5.0"
  "jws": ">=3.2.3"
  "js-yaml": ">=4.3.2 <5"
  "body-parser": ">=2.3.0"
  "minimatch@^5.0.0": "5.1.9"
  "minimatch@^10.0.0": "10.2.6"
  "flatted": "3.4.4"
  "picomatch": "2.3.2"
  "path-to-regexp": "8.4.2"
  "lodash": "4.18.1"
  "ip-address": ">=10.7.0"
  "fast-uri": ">=4.1.3"
  "postcss": ">=8.5.28"
  "vite": ">=8.0.16"
  "sharp": ">=0.35.4"
  "multer": ">=2.3.0"
  "zod": ">=4.6.2"
  "qs": ">=6.16.0"
  "esbuild": ">=0.28.1"
  "undici": "7.29.0"
  
