project_name: "imageTransformer"
version: "1.3.2"
type: "monorepo (pnpm workspace v11)"
license: "CC BY-NC-SA 4.0"

stack_tecnologico:
  - "TypeScript 6 (strict, isolatedModules, bundler mode)"
  - "Vite 8 (dev server, HMR, polling mode)"
  - "Vanilla Web Components (Custom Elements v1, Shadow DOM)"
  - "Vanilla CSS / CSS Custom Properties"
  - "Express 5 + Sharp 0.34 (backend API REST)"
  - "Lucide Icons via <tn-icon> Web Component"
  - "Figtree (UI) + IBM Plex Mono (data/code)"
  - "WCAG 2.2 AAA"
  - "Neon-Code UI Kit / SNA"

tooling:
  package_manager: "pnpm v11"
  quality:
    - "Biome v2 (formatter)"
    - "Oxlint v1 (linter)"
    - "ls-lint v2 (naming)"
    - "Husky v9 + lint-staged + commitlint"
  testing: "Vitest + JSDOM"
  docker: "Docker multi-stage (Node 24 Alpine + Nginx Alpine)"

carpetas_relevantes:
  - "src/components/       # Web Components PascalCase"
  - "src/utils/            # Utilidades camelCase"
  - "src/types/            # Definiciones de tipos"
  - "src/__tests__/        # Suites TDD"
  - "backend/src/          # Logica backend camelCase"
  - ".ia/                  # Configuracion agentica"

carpetas_omitidas:
  - node_modules
  - backend/node_modules
  - dist/
  - .git/
  - .husky/

entrypoints:
  frontend: "index.html"
  backend: "backend/src/index.ts"

commands:
  dev: "pnpm dev"
  build: "pnpm build"
  test: "pnpm test"
  lint: "pnpm lint"
  format: "pnpm format"
  type-check: "pnpm type-check"

env_keys:
  - "PORT"
  - "NODE_ENV"
  - "API_URL"
  - "TEMP_DIR"
  - "MAX_FILE_SIZE"
  - "RATE_LIMIT_WINDOW_MS"
  - "RATE_LIMIT_MAX"
  - "CORS_ORIGIN"
  - "LOG_LEVEL"
  - "UPLOAD_DIR"

services:
  - "backend: Express API + Sharp image processing"
  - "frontend: Vite SPA, Nginx en produccion"

skills_instaladas:
  - "code-hygiene"
  - "git-standards"
  - "security-audit"
  - "tdd-playbook"
  - "a11y-css"

politicas: "Uso obligatorio de .ia/AGENTS.md + AGENTS.md raiz"
